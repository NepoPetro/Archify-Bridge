  const svg = document.querySelector('.diagram-scroll svg');
  const resetButton = document.querySelector('[data-zoom-reset]');
  const measure = document.createElement('canvas').getContext('2d');
  const nodes = [...document.querySelectorAll('.node-label')];
  const edges = [...document.querySelectorAll('.edge-label')];
  let zoom = 1;
  const setZoom = (next) => {
    zoom = Math.min(2.5, Math.max(0.75, next));
    svg.style.width = `${1800 * zoom}px`;
    resetButton.textContent = `${Math.round(zoom * 100)}%`;
  };
  document.querySelector('[data-zoom-in]').addEventListener('click', () => setZoom(zoom + 0.15));
  document.querySelector('[data-zoom-out]').addEventListener('click', () => setZoom(zoom - 0.15));
  resetButton.addEventListener('click', () => setZoom(1));
  function renderNode(label, value) {
    const rect = label.previousElementSibling;
    if (!rect || rect.tagName.toLowerCase() !== 'rect') return;
    measure.font = getComputedStyle(label).font;
    const maxWidth = rect.width.baseVal.value - 16;
    const wrapped = [];
    value.split('\n').forEach((sourceLine) => {
      let line = '';
      sourceLine.trim().split(/\s+/).forEach((word) => {
        const candidate = line ? `${line} ${word}` : word;
        if (line && measure.measureText(candidate).width > maxWidth) { wrapped.push(line); line = word; }
        else line = candidate;
      });
      if (line) wrapped.push(line);
    });
    const centerX = rect.x.baseVal.value + rect.width.baseVal.value / 2;
    const centerY = rect.y.baseVal.value + rect.height.baseVal.value / 2;
    label.replaceChildren();
    label.setAttribute('y', centerY - ((wrapped.length - 1) * 8));
    wrapped.forEach((line, index) => {
      const span = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
      span.setAttribute('x', centerX); span.setAttribute('dy', index === 0 ? '0' : '16'); span.textContent = line; label.appendChild(span);
    });
  }
  nodes.forEach((node) => { node.dataset.original = [...node.querySelectorAll('tspan')].map((span) => span.textContent).join('\n'); });
  edges.forEach((edge) => { edge.dataset.original = edge.textContent.trim(); });
  const langButtons = [...document.querySelectorAll('[data-lang]')];
  function setLanguage(lang) {
    const text = ui[lang] || ui.es;
    document.documentElement.lang = lang;
    document.title = text.title;
    document.querySelector('h1').textContent = text.title;
    document.querySelector('.subtitle').textContent = text.subtitle;
    document.querySelector('.eyebrow').textContent = text.credit;
    document.querySelector('.diagram-toolbar > span').textContent = text.canvas;
    document.querySelector('[data-zoom-in]').setAttribute('aria-label', text.zoomIn);
    document.querySelector('[data-zoom-out]').setAttribute('aria-label', text.zoomOut);
    svg.setAttribute('aria-label', text.title);
    nodes.forEach((node, index) => renderNode(node, nodeTranslations[lang]?.[index] || node.dataset.original));
    edges.forEach((edge, index) => { edge.textContent = edgeTranslations[lang]?.[index] || edge.dataset.original; });
    langButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.lang === lang)));
    try { localStorage.setItem('authentication-platform-language', lang); } catch (_) {}
  }
  langButtons.forEach((button) => button.addEventListener('click', () => setLanguage(button.dataset.lang)));
  let initialLanguage = 'es';
  try { const saved = localStorage.getItem('authentication-platform-language'); if (ui[saved]) initialLanguage = saved; } catch (_) {}
  setZoom(1);
  setLanguage(initialLanguage);
})();
</script>
</body></html>
